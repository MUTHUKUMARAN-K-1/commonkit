<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="610" viewBox="0 0 1280 610" role="img" aria-labelledby="title desc">
<title id="title">CommonKit architecture and trust boundaries</title><desc id="desc">Borrower and custodian sign library actions through Meteor. Council members sign Sputnik proposals and votes. Two approvals let the DAO call resolve on the library. The library stores escrow and credits and transfers withdrawals. A wallet-free verifier reads state and receipts.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3d4ddb" stroke-width="1.4"/></marker></defs>
<rect width="1280" height="610" rx="16" fill="#f7f5f0"/>
<g font-family="Arial,sans-serif" fill="#202238">
<text x="52" y="54" font-size="12" letter-spacing="2" fill="#626577">COMMONKIT / WHO CAN DO WHAT</text><text x="52" y="99" font-size="32" letter-spacing="-1">Wallets authorize. Contracts enforce. Receipts explain.</text>
<rect x="52" y="145" width="306" height="141" rx="10" fill="#fff" stroke="#dedee5"/><text x="76" y="180" font-size="12" fill="#626577" letter-spacing="1.5">METEOR WEB</text><text x="76" y="215" font-size="22">Borrower + custodian</text><text x="76" y="249" font-size="15" fill="#626577">Reserve, hand over and inspect return</text>
<rect x="52" y="329" width="306" height="141" rx="10" fill="#fff" stroke="#dedee5"/><text x="76" y="364" font-size="12" fill="#626577" letter-spacing="1.5">METEOR WEB</text><text x="76" y="399" font-size="22">Two council accounts</text><text x="76" y="433" font-size="15" fill="#626577">Propose and approve DAO actions</text>
<path d="M358 213H482" stroke="#3d4ddb" stroke-width="2" marker-end="url(#arrow)"/><path d="M358 398H482" stroke="#3d4ddb" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="199" font-size="12" fill="#626577">signed calls</text><text x="380" y="384" font-size="12" fill="#626577">signed votes</text>
<rect x="494" y="145" width="334" height="141" rx="10" fill="#3d4ddb"/><text x="518" y="180" font-size="12" fill="#e9ecff" letter-spacing="1.5">COMMONKIT LIBRARY / RUST</text><text x="518" y="215" font-size="22" fill="#fff">Bookings, escrow and credits</text><text x="518" y="249" font-size="15" fill="#e9ecff">Settlement records credits; withdrawals pay</text>
<rect x="494" y="329" width="334" height="141" rx="10" fill="#f4b49b"/><text x="518" y="364" font-size="12" letter-spacing="1.5">EXISTING SPUTNIK DAO</text><text x="518" y="399" font-size="22">Policy, proposals and votes</text><text x="518" y="433" font-size="15">2 of 2 approvals authorize execution</text>
<path d="M661 329V289" stroke="#3d4ddb" stroke-width="2" marker-end="url(#arrow)"/><text x="680" y="312" font-size="12" fill="#626577">resolve / DAO withdrawal</text>
<rect x="954" y="145" width="274" height="325" rx="10" fill="#fff" stroke="#dedee5"/><text x="978" y="180" font-size="12" fill="#626577" letter-spacing="1.5">PUBLIC VERIFIER / READ ONLY</text><text x="978" y="221" font-size="23">No wallet needed.</text><text x="978" y="265" font-size="16">Booking and proposal binding</text><text x="978" y="298" font-size="16">Votes and execution receipts</text><text x="978" y="331" font-size="16">Both final transfers</text><text x="978" y="364" font-size="16">Current ledger invariant</text><path d="M978 391H1204" stroke="#dedee5"/><text x="978" y="424" font-size="14" fill="#626577">Public RPC · one finalized block</text>
<path d="M828 215H944" stroke="#3d4ddb" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><path d="M828 398H944" stroke="#3d4ddb" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="854" y="199" font-size="12" fill="#626577">state +</text><text x="854" y="235" font-size="12" fill="#626577">receipts</text>
<path d="M52 514H1228" stroke="#dedee5"/><text x="52" y="550" font-size="15" fill="#626577">Evidence hashes bind files, not physical truth. Demo council accounts share one operator. All funds are testnet NEAR.</text><text x="52" y="579" font-size="13" fill="#626577">No production signing server. Private keys stay in the operator's wallet; the verifier never signs.</text>
</g></svg>
